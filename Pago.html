<body>

  
  <form action="/procesar-pago" method="post">
    <p class="pagos">
      <img src="Recursos/Metodos de pago.png" alt="Metodos de pago">
    </p>
    
    <label for="nombre-titular">Nombre del Titular:</label>
    <input type="text" id="nombre-titular" name="nombre-titular" required>

    <label for="num-tarjeta">Número de Tarjeta:</label>
    <input type="text" id="num-tarjeta" name="num-tarjeta" placeholder="XXXX XXXX XXXX XXXX" required>

    <div >
      <label for="fecha-exp">Caducidad:</label>
      <input type="text" id="fecha-exp" name="fecha-exp" placeholder="MM/AA" required>

      <label for="cvv">CVV:</label>
      <input type="text" id="cvv" name="cvv" required>
    </div>
    <DIV >
      <div >
          <table>
              <tr>
                  <td>
                    <label for="Dirección">Dirección:</label>      
                      
                  </td>
              </tr>
              <tr>
                <td>
                  <textarea class="Texto" name="Descripción" id="Descripción" cols="30" rows="10" placeholder="Se le contactará para calcular el precio de envío..."></textarea> 
                </td>
              </tr>
          </table>
      </div>
</DIV>
    

    <button type="submit">Pagar</button>
</form>
